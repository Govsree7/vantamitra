<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#218c35">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>VantaMitra</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#202b20;background:#fff}
.app{max-width:520px;margin:auto;min-height:100vh}header{padding:22px 22px 18px;background:linear-gradient(120deg,#fff5d8,#eff8e9)}
.brand{font-size:31px;font-weight:800}.g{color:#218c35}.o{color:#ff7a1a}.sub{color:#6c5a48;margin-top:5px}
.lang,.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{font-family:inherit}
.lang button,.filter{border:1px solid #d5ddd1;background:#fff;border-radius:22px;padding:9px 15px}
.active{background:#218c35!important;color:#fff!important;border-color:#218c35!important}
main{padding:20px}h1{font-size:26px;margin:8px 0 4px}.muted{color:#777}
.inputbox{display:flex;gap:8px;border:2px solid #dbe9d3;border-radius:18px;padding:7px;margin-top:18px}
input{border:0;outline:0;flex:1;padding:11px;font-size:16px}.add{width:54px;border:0;border-radius:14px;background:#218c35;color:#fff;font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{background:#eef8e8;border:1px solid #cde2c3;border-radius:20px;padding:7px 10px}
.chip button{border:0;background:none;margin-left:6px}.find{width:100%;border:0;border-radius:18px;padding:16px;background:#218c35;color:#fff;font-weight:700;font-size:19px}
.resultHead{display:flex;justify-content:space-between;align-items:center;margin:25px 0 10px}.count{font-size:13px;color:#777}
.card{border:1px solid #e4e4e4;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}
.card h3{margin:0 0 6px}.meta{color:#777;font-size:13px}.score{color:#218c35;font-size:13px;font-weight:700;margin:8px 0}
.tag{display:inline-block;background:#f3f3f3;border-radius:12px;padding:4px 8px;font-size:12px;margin-right:5px}.view{border:0;background:#f47a20;color:#fff;border-radius:12px;padding:10px 14px;font-weight:700}
.empty{text-align:center;color:#777;padding:35px 10px}footer{text-align:center;color:#888;border-top:1px solid #eee;padding:22px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.close{float:right;border:0;background:#eee;border-radius:50%;width:38px;height:38px;font-size:20px}
.sheet ul,.sheet ol{padding-left:22px;line-height:1.55}.pill{display:inline-block;background:#eef8e8;color:#218c35;border-radius:16px;padding:5px 9px;margin:2px 5px 2px 0;font-size:12px}
.searchbar{width:100%;border:1px solid #ddd;border-radius:14px;padding:10px 12px;margin-top:12px;font-size:15px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand"><span class="g">Vanta</span><span class="o">Mitra</span></div>
<div class="sub">వంట మిత్ర • Your Cooking Friend</div>
<div class="lang"><button id="teBtn" class="active" onclick="setLang('te')">తెలుగు</button><button id="enBtn" onclick="setLang('en')">English</button></div>
</header>
<main>
<h1 id="title">ఈరోజు ఏమి వండాలి?</h1>
<div class="muted" id="subtitle">మీ దగ్గర ఉన్న పదార్థాలు ఇవ్వండి</div>

<div class="inputbox">
<input id="ingredientInput" placeholder="e.g. tomato, rice, egg" onkeydown="if(event.key==='Enter')addIngredient()">
<button class="add" onclick="addIngredient()">+</button>
</div>
<div class="chips" id="chips"></div>

<div class="filters">
<button class="filter active" data-diet="all" onclick="setDiet('all',this)">All</button>
<button class="filter" data-diet="veg" onclick="setDiet('veg',this)">🥬 Veg</button>
<button class="filter" data-diet="nonveg" onclick="setDiet('nonveg',this)">🍗 Non-Veg</button>
</div>

<input class="searchbar" id="recipeSearch" placeholder="Search recipes..." oninput="renderResults()">
<button class="find" id="findBtn" onclick="findRecipes()">🔍 వంటకాలు చూపించు</button>

<div class="resultHead"><h2 id="suggestionTitle">వంటకాల సూచనలు</h2><span class="count" id="count"></span></div>
<div id="results"><div class="empty">ముందుగా కొన్ని పదార్థాలు జోడించండి.</div></div>
</main>
<footer>VantaMitra • Simple cooking guidance for every home</footer>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="recipeDetail"></div></div></div>

<script>
const recipes = [{"id": 1, "diet": "veg", "category": "Breakfast", "keys": ["rice", "urad dal"], "time": "35 min", "serves": "4", "en": {"name": "Idli", "ingredients": ["2 cups idli rice", "1 cup urad dal", "Salt"], "steps": ["Soak rice and urad dal separately.", "Grind to a smooth batter and mix.", "Ferment overnight.", "Add salt and steam in idli plates for 10–12 minutes."]}, "te": {"name": "ఇడ్లీ", "ingredients": ["2 కప్పులు ఇడ్లీ బియ్యం", "1 కప్పు మినప్పప్పు", "ఉప్పు"], "steps": ["బియ్యం, మినప్పప్పు వేర్వేరుగా నానబెట్టండి.", "మెత్తగా రుబ్బి కలపండి.", "రాత్రంతా పులియనివ్వండి.", "ఉప్పు వేసి ఇడ్లీ ప్లేట్లలో 10–12 నిమిషాలు ఆవిరిపై ఉడికించండి."]}}, {"id": 2, "diet": "veg", "category": "Breakfast", "keys": ["rice", "urad dal"], "time": "30 min", "serves": "4", "en": {"name": "Dosa", "ingredients": ["2 cups rice", "1 cup urad dal", "Salt", "Oil"], "steps": ["Soak rice and urad dal.", "Grind and ferment the batter.", "Add salt.", "Spread thin on a hot tawa and roast with a little oil."]}, "te": {"name": "దోసె", "ingredients": ["2 కప్పులు బియ్యం", "1 కప్పు మినప్పప్పు", "ఉప్పు", "నూనె"], "steps": ["బియ్యం, మినప్పప్పు నానబెట్టండి.", "రుబ్బి పిండిని పులియనివ్వండి.", "ఉప్పు కలపండి.", "వేడి పెనం మీద పలుచగా పోసి కొద్దిగా నూనెతో కాల్చండి."]}}, {"id": 3, "diet": "veg", "category": "Breakfast", "keys": ["rava", "onion", "green chilli"], "time": "20 min", "serves": "3", "en": {"name": "Upma", "ingredients": ["1 cup rava", "1 onion", "2 green chillies", "2 cups water", "Salt", "1 tbsp oil"], "steps": ["Dry roast rava.", "Fry onion and chilli in oil.", "Add water and salt; bring to boil.", "Add rava slowly and cook until soft."]}, "te": {"name": "ఉప్మా", "ingredients": ["1 కప్పు రవ్వ", "1 ఉల్లిపాయ", "2 పచ్చిమిర్చులు", "2 కప్పుల నీరు", "ఉప్పు", "1 tbsp నూనె"], "steps": ["రవ్వను స్వల్పంగా వేయించండి.", "నూనెలో ఉల్లిపాయ, పచ్చిమిర్చి వేయించండి.", "నీరు, ఉప్పు వేసి మరిగించండి.", "రవ్వను నెమ్మదిగా వేసి మెత్తగా అయ్యే వరకు ఉడికించండి."]}}, {"id": 4, "diet": "veg", "category": "Breakfast", "keys": ["poha", "onion", "peanut"], "time": "15 min", "serves": "2", "en": {"name": "Poha", "ingredients": ["2 cups poha", "1 onion", "2 tbsp peanuts", "1 green chilli", "Salt", "1 tbsp oil"], "steps": ["Rinse poha quickly.", "Fry peanuts, onion and chilli.", "Add poha and salt.", "Mix and cook for 3–4 minutes."]}, "te": {"name": "అటుకుల ఉప్మా", "ingredients": ["2 కప్పులు అటుకులు", "1 ఉల్లిపాయ", "2 tbsp పల్లీలు", "1 పచ్చిమిర్చి", "ఉప్పు", "1 tbsp నూనె"], "steps": ["అటుకులను త్వరగా కడగండి.", "పల్లీలు, ఉల్లిపాయ, పచ్చిమిర్చి వేయించండి.", "అటుకులు, ఉప్పు వేయండి.", "కలిపి 3–4 నిమిషాలు ఉడికించండి."]}}, {"id": 5, "diet": "veg", "category": "Breakfast", "keys": ["green gram", "ginger", "green chilli"], "time": "25 min", "serves": "3", "en": {"name": "Pesarattu", "ingredients": ["1 cup green gram", "1 inch ginger", "2 green chillies", "Salt", "Oil"], "steps": ["Soak green gram for 4 hours.", "Grind with ginger and chilli.", "Add salt.", "Spread on tawa and roast both sides."]}, "te": {"name": "పెసరట్టు", "ingredients": ["1 కప్పు పెసలు", "1 అంగుళం అల్లం", "2 పచ్చిమిర్చులు", "ఉప్పు", "నూనె"], "steps": ["పెసలను 4 గంటలు నానబెట్టండి.", "అల్లం, పచ్చిమిర్చితో రుబ్బండి.", "ఉప్పు కలపండి.", "పెనం మీద పోసి రెండు వైపులా కాల్చండి."]}}, {"id": 6, "diet": "veg", "category": "Breakfast", "keys": ["rava", "rice flour", "onion"], "time": "25 min", "serves": "3", "en": {"name": "Rava Dosa", "ingredients": ["1 cup rava", "1/2 cup rice flour", "1 onion", "2 cups water", "Salt", "Oil"], "steps": ["Mix rava, rice flour, onion, salt and water.", "Rest for 15 minutes.", "Pour thinly on hot tawa.", "Roast until crisp."]}, "te": {"name": "రవ్వ దోసె", "ingredients": ["1 కప్పు రవ్వ", "1/2 కప్పు బియ్యప్పిండి", "1 ఉల్లిపాయ", "2 కప్పుల నీరు", "ఉప్పు", "నూనె"], "steps": ["రవ్వ, బియ్యప్పిండి, ఉల్లిపాయ, ఉప్పు, నీరు కలపండి.", "15 నిమిషాలు ఉంచండి.", "వేడి పెనం మీద పలుచగా పోయండి.", "కరకరలాడే వరకు కాల్చండి."]}}, {"id": 7, "diet": "nonveg", "category": "Breakfast", "keys": ["bread", "egg", "onion"], "time": "10 min  v=v.trim().toLowerCase();

}

 selected.forEach(s=>{ if(r.keys.some(k=>k.includes(s)||s.includes(k)))score++; });

}

 currentMatches=recipes.map(r=>({...r,score:scoreRecipe(r)})).filter(r=>r.score>0).sort((a,b)=>b.score-a.score||a.en.name.localeCompare(b.en.name));

}

 if(q)list=list.filter(r=>r.en.name.toLowerCase().includes(q)||r.te.name.includes(q)||r.category.toLowerCase().includes(q));
 if(selected.length===0 && !q && currentMatches.length===0){
   results.innerHTML=`<div class="empty">${lang==='te'?'ముందుగా కొన్ని పదార్థాలు జోడించండి లేదా వంటకం వెతకండి.':'Add ingredients or search for a recipe.'}</div>`;
   count.textContent=''; return;
 }
 if(!list.length){results.innerHTML=`<div class="empty">${lang==='te'?'సరిపడే వంటకం దొరకలేదు.':'No matching recipe found.'}</div>`;count.textContent='0';return;}
 count.textContent=`${list.length} ${lang==='te'?'వంటకాలు':'recipes'}`;
 results.innerHTML=list.map(r=>{
   const t=r[lang], m=r.score?`<div class="score">${lang==='te'?r.score+' పదార్థాలు సరిపడ్డాయి':r.score+' ingredient match'+(r.score>1?'es':'')}</div>`:'';
   return `<div class="card"><h3>${t.name}</h3><div class="meta">⏱ ${r.time} • 👥 ${r.serves}</div>${m}<div style="margin:8px 0"><span class="tag">${r.diet==='veg'?'🥬 Veg':'🍗 Non-Veg'}</span><span class="tag">${r.category}</span></div><button class="view" onclick="openRecipe(${r.id})">${lang==='te'?'వంట విధానం':'View Recipe'}</button></div>`;
 }).join('');
}
function openRecipe(id){
 const r=recipes.find(x=>x.id===id),t=r[lang];
 recipeDetail.innerHTML=`<h2>${t.name}</h2><span class="pill">⏱ ${r.time}</span><span class="pill">👥 ${r.serves}</span><span class="pill">${r.diet==='veg'?'🥬 Veg':'🍗 Non-Veg'}</span><h4>${lang==='te'?'పదార్థాలు':'Ingredients'}</h4><ul>${t.ingredients.map(x=>`<li>${x}</li>`).join('')}</ul><h4>${lang==='te'?'వంట విధానం':'Steps'}</h4><ol>${t.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`;
 modal.style.display='flex';
}
function closeModal(){modal.style.display='none'}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
