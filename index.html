<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#218c35">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>VantaMitra V6</title>
<style>
*{box-sizing:border-box}
:root{--green:#218c35;--orange:#f47a20;--soft:#eef8e8;--text:#202b20;--line:#e2e6df}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f3;color:var(--text)}
.app{max-width:620px;margin:auto;min-height:100vh;background:white}
header{padding:18px 18px 15px;background:linear-gradient(120deg,#fff4d5,#eef8e8);border-bottom:1px solid #e8eee4}
.brand{font-size:31px;font-weight:800}.g{color:var(--green)}.o{color:#ff7a1a}.sub{color:#6c5a48;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font-family:inherit}
.lang{margin-top:11px}
.lang button,.pillbtn{border:1px solid #d6ddd2;background:#fff;border-radius:22px;padding:9px 13px}
.active{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important}
main{padding:16px}
h1{font-size:24px;margin:8px 0 3px}.muted{color:#777;font-size:14px;line-height:1.4}
.inputbox{display:grid;grid-template-columns:1fr 48px 48px;gap:7px;border:2px solid #dbe9d3;border-radius:18px;padding:7px;margin-top:14px}
input{border:0;outline:0;min-width:0;padding:10px;font-size:16px;background:transparent}
.add,.mic{border:0;border-radius:14px;color:#fff;font-size:22px}
.add{background:var(--green)}.mic{background:var(--orange)}.mic.listening{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(.92);opacity:.7}}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--soft);border:1px solid #cde2c3;border-radius:20px;padding:7px 10px}
.chip button{border:0;background:none}
.label{font-size:13px;color:#777;margin:14px 0 7px}
.quickrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.quickrow button{padding:8px 6px;font-size:12px}
.wraprow{display:flex;gap:8px;flex-wrap:wrap}
.searchbar{width:100%;border:1px solid #ddd;border-radius:14px;padding:11px 12px;margin:12px 0}
.find{width:100%;border:0;border-radius:18px;padding:15px;background:var(--green);color:#fff;font-weight:700;font-size:18px}
.smartbox{display:none;background:#f7fbf4;border:1px solid #d9e9d2;border-radius:16px;padding:12px;margin-top:12px;font-size:13px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}
.stat{background:#f4f7f1;border-radius:14px;padding:9px;text-align:center;font-size:11px}
.stat b{display:block;font-size:18px;color:var(--green)}
.resultHead{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.count{font-size:12px;color:#777}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 2px 9px #00000008}
.photo{height:120px;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden;background:linear-gradient(135deg,#eef8e8,#fff1d6)}
.photo img{width:100%;height:100%;object-fit:cover}
.heart{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;border-radius:50%;background:#ffffffdf;font-size:18px}
.badgeNow{position:absolute;left:8px;top:8px;background:var(--green);color:#fff;border-radius:12px;padding:4px 7px;font-size:10px;font-weight:700}
.cardbody{padding:11px}.card h3{font-size:16px;margin:0 0 6px;line-height:1.2}
.meta{font-size:11px;color:#777}.score{font-size:11px;color:var(--green);font-weight:700;margin:6px 0}
.missing{font-size:10px;color:#8a5a21;margin-bottom:7px;line-height:1.35}
.tag{display:inline-block;background:#f2f2f2;border-radius:11px;padding:3px 6px;font-size:10px;margin:0 3px 4px 0}
.view{width:100%;border:0;background:var(--orange);color:#fff;border-radius:10px;padding:8px;font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:#777;padding:38px 10px}
footer{text-align:center;color:#888;border-top:1px solid #eee;padding:20px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:620px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}
.close{float:right;border:0;background:#eee;border-radius:50%;width:38px;height:38px;font-size:20px}
.hero{height:160px;border-radius:18px;background:linear-gradient(135deg,#eef8e8,#fff0d4);display:flex;align-items:center;justify-content:center;font-size:72px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.smallpill{display:inline-block;background:var(--soft);color:var(--green);border-radius:15px;padding:5px 8px;margin:4px 4px 4px 0;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.actions button{flex:1;min-width:120px;border:1px solid #ddd;background:#fff;border-radius:12px;padding:9px}
.servebox{display:flex;align-items:center;justify-content:space-between;background:#f7f8f5;border:1px solid #e5e7e2;border-radius:14px;padding:10px 12px;margin:12px 0}
.stepper{display:flex;align-items:center;gap:9px}.stepper button{width:34px;height:34px;border:1px solid #d6ddd2;border-radius:50%;background:#fff;font-size:18px}
.ingredients li,.steps li{margin-bottom:8px;line-height:1.5}
.steps li.done{text-decoration:line-through;color:#999}
.stepRow{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start}
.stepCheck{width:22px;height:22px}
.timerbtn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:6px 9px;font-size:12px;margin-top:5px}
.timerbar{display:none;background:#fff7e8;border:1px solid #f1ddbb;border-radius:12px;padding:10px;margin-top:8px;font-size:13px}
.shop{background:#fff7e8;border:1px solid #f1ddbb;border-radius:14px;padding:12px;margin:10px 0;font-size:13px;line-height:1.5}
.note{font-size:12px;color:#777;margin-top:10px}
@media(max-width:430px){.grid{grid-template-columns:1fr}.quickrow{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand"><span class="g">Vanta</span><span class="o">Mitra</span> <small style="font-size:12px;color:#777">V6</small></div>
<div class="sub">వంట మిత్ర • Your Cooking Friend</div>
<div class="row lang"><button id="teBtn" class="active" onclick="setLang('te')">తెలుగు</button><button id="enBtn" onclick="setLang('en')">English</button></div>
</header>

<main>
<h1 id="title">ఈరోజు ఏమి వండాలి?</h1>
<div class="muted" id="subtitle">పదార్థాలు ఇవ్వండి లేదా 🎤 మాట్లాడండి</div>

<div class="inputbox">
<input id="ingredientInput" placeholder="టమాటా / tomato" onkeydown="if(event.key==='Enter')addIngredient()">
<button class="mic" id="micBtn" onclick="startVoice()">🎤</button>
<button class="add" onclick="addIngredient()">+</button>
</div>
<div class="chips" id="chips"></div>

<div class="label" id="quickLabel">త్వరగా జోడించండి</div>
<div class="quickrow" id="quickIngredients"></div>

<div class="label" id="dietLabel">ఆహార రకం</div>
<div class="wraprow">
<button class="pillbtn active dietbtn" onclick="setDiet('all',this)">All</button>
<button class="pillbtn dietbtn" onclick="setDiet('veg',this)">🥬 Veg</button>
<button class="pillbtn dietbtn" onclick="setDiet('nonveg',this)">🍗 Non-Veg</button>
</div>

<div class="label" id="mealLabel">సమయం</div>
<div class="wraprow">
<button class="pillbtn active mealbtn" onclick="setMeal('all',this)">All</button>
<button class="pillbtn mealbtn" onclick="setMeal('breakfast',this)">🌅 Breakfast</button>
<button class="pillbtn mealbtn" onclick="setMeal('lunch',this)">☀️ Lunch</button>
<button class="pillbtn mealbtn" onclick="setMeal('dinner',this)">🌙 Dinner</button>
<button class="pillbtn mealbtn" onclick="setMeal('snack',this)">☕ Snack</button>
</div>

<div class="label" id="catLabel">కేటగిరీలు</div>
<div class="wraprow" id="catButtons"></div>

<input class="searchbar" id="recipeSearch" placeholder="వంటకం వెతకండి..." oninput="renderResults()">

<div class="wraprow" style="margin-bottom:12px">
<button class="pillbtn" id="favBtn" onclick="toggleFavoritesView()">♡ Favorites</button>
<button class="pillbtn" id="shopBtn" onclick="showShoppingList()">🛒 Shopping List</button>
</div>

<button class="find" id="findBtn" onclick="findRecipes()">🧠 స్మార్ట్ వంటకాలు చూపించు</button>
<div class="smartbox" id="smartBox"></div>

<div class="stats">
<div class="stat"><b>225</b><span id="statRecipes">వంటకాలు</span></div>
<div class="stat"><b id="favCount">0</b><span id="statFav">ఇష్టమైనవి</span></div>
<div class="stat"><b id="pantryCount">0</b><span id="statPantry">పదార్థాలు</span></div>
</div>

<div class="resultHead"><h2 id="suggestionTitle">వంటకాల సూచనలు</h2><span class="count" id="count"></span></div>
<div class="grid" id="results"><div class="empty">పదార్థాలు జోడించండి లేదా వంటకం వెతకండి.</div></div>
</main>
<footer>VantaMitra V6 • Smarter cooking, step by step</footer>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="recipeDetail"></div></div>
</div>

function normalize(v){

function matches(k,s){k=normalize(k);s=normalize(s);return k===s||k.includes(s)||s.includes(k)}
function rank(r){
const matchedKeys=r.keys.filter(k=>selected.some(s=>matches(k,s)));
const uniqueMatches=[...new Set(matchedKeys)].length;
const coverage=r.keys.length?uniqueMatches/r.keys.length:0;
const missing=r.keys.filter(k=>!selected.some(s=>matches(k,s)));
const cookNow=selected.length>0&&(coverage>=0.67||(coverage>=0.5&&missing.length<=1));
const points=coverage*150+uniqueMatches*22-missing.length*5+(cookNow?20:0);
return{matches:uniqueMatches,coverage,missing,points,cookNow};
}
function findRecipes(){
if(!selected.length){currentMatches=[];smartBox.style.display='block';smartBox.textContent=lang==='te'?'ముందుగా కనీసం ఒక పదార్థం జోడించండి.':'Add at least one ingredient first.';renderResults();return}

}

<h4>${lang==='te'?'పదార్థాలు':'Ingredients'}</h4><ul class="ingredients">${t.ingredients.map(x=>`<li>${scaleText(x,ratio)}</li>`).join('')}</ul>
<h4>${lang==='te'?'వంట విధానం':'Steps'}</h4><ol class="steps">${t.steps.map((x,i)=>`<li id="step${i}"><div class="stepRow"><input class="stepCheck" type="checkbox" onchange="markStep(${i},this.checked)"><div>${x}<br><button class="timerbtn" onclick="startTimer(${i},5)">${lang==='te'?'⏱ 5 నిమిషాల టైమర్':'⏱ 5 min timer'}</button><div class="timerbar" id="timer${i}"></div></div></div></li>`).join('')}</ol>
<div class="note">${lang==='te'?'గమనిక: పరిమాణాలు అంచనా మాత్రమే. మీ రుచికి అనుగుణంగా ఉప్పు, కారం, నీరు సర్దుబాటు చేసుకోండి.':'Note: Quantities are approximate. Adjust salt, spice and water to taste.'}</div>`;
modal.style.display='flex';
}
function changeServe(delta){currentServe=Math.max(1,currentServe+delta);renderRecipeDetail()}
function markStep(i,done){document.getElementById('step'+i)?.classList.toggle('done',done)}
function startTimer(i,min){const box=document.getElementById('timer'+i);let left=min*60;box.style.display='block';clearInterval(box._t);box._t=setInterval(()=>{const m=Math.floor(left/60),s=left%60;box.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;left--;if(left<0){clearInterval(box._t);box.textContent=lang==='te'?'✅ టైమర్ పూర్తైంది':'✅ Timer done'}},1000)}
function shareRecipe(id){const r=recipes.find(x=>x.id===id),t=r[lang],tx=`${t.name}\n${t.ingredients.join(', ')}`;if(navigator.share)navigator.share({title:t.name,text:tx}).catch(()=>{});else navigator.clipboard?.writeText(tx)}
function closeModal(){modal.style.display='none'}
function showShoppingList(){if(!selected.length){alert(lang==='te'?'ముందుగా మీ దగ్గర ఉన్న పదార్థాలు జోడించండి.':'Add the ingredients you already have first.');return}let list=filtered().slice(0,6),miss=[...new Set(list.flatMap(r=>r.missing||[]))].slice(0,15);recipeDetail.innerHTML=`<h2>${lang==='te'?'🛒 షాపింగ్ లిస్ట్':'🛒 Shopping List'}</h2><div class="shop">${miss.length?miss.map(x=>'• '+dIng(x)).join('<br>'):(lang==='te'?'మీ దగ్గర అవసరమైన ప్రధాన పదార్థాలు చాలావరకు ఉన్నాయి.':'You already have most key ingredients.')}</div>`;modal.style.display='flex'}
function updateStats(){favCount.textContent=getFav().length;pantryCount.textContent=selected.length}

function startVoice(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){alert(lang==='te'?'ఈ బ్రౌజర్‌లో వాయిస్ ఇన్‌పుట్ అందుబాటులో లేదు. కీబోర్డ్ మైక్ ఉపయోగించండి.':'Voice input is not supported in this browser. Use the keyboard microphone.');return}
const rec=new SR();rec.lang=lang==='te'?'te-IN':'en-IN';rec.interimResults=false;rec.maxAlternatives=1;
micBtn.classList.add('listening');micBtn.textContent='●';
rec.onresult=e=>{const heard=e.results[0][0].transcript;ingredientInput.value=heard;addTokens(heard);ingredientInput.value=''};
rec.onerror=()=>alert(lang==='te'?'వాయిస్ వినిపించలేదు. మళ్లీ ప్రయత్నించండి.':'Could not hear you. Please try again.');
rec.onend=()=>{micBtn.classList.remove('listening');micBtn.textContent='🎤'};
rec.start();
}

renderQuick();renderCats();updateStats();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
